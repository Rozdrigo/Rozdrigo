<text class="m fade" style="animation-delay:1.14s" x="582" y="280" font-size="14.5" fill="#e2e8f0"><tspan fill="#c084fc">boolean</tspan> hackathonWinner = <tspan fill="#fb923c">true</tspan>;</text>
<text x="536" y="280" class="m" font-size="12" fill="#475569" text-anchor="end">8</text>
<text class="m fade" style="animation-delay:1.26s" x="560" y="304" font-size="14.5" fill="#e2e8f0">}</text>
