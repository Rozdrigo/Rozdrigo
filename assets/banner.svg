<text x="56" y="92" class="f" font-size="15" fill="#22d3ee" letter-spacing="3" font-weight="600">OLÁ, EU SOU O</text>
<text x="54" y="150" class="f" font-size="54" font-weight="800" fill="#f8fafc">Rodrigo Coelho</text>
<rect x="56" y="168" width="120" height="5" rx="2.5" fill="url(#acc)"/>
<text x="56" y="210" class="f" font-size="22" font-weight="600" fill="#e2e8f0">Engenheiro de Software · Fullstack</text>
<text x="56" y="242" class="f" font-size="16" fill="#94a3b8">Microsserviços e APIs em Java, Spring Boot, .NET e Go</text>
<text x="56" y="266" class="f" font-size="16" fill="#94a3b8">Assinatura eletrônica · Certificação digital · Pagamentos</text>
<g transform="translate(56,296)">
  <rect width="226" height="34" rx="17" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="113" y="22" class="f" font-size="14" font-weight="700" fill="#fcd34d" text-anchor="middle">🏆 1º Hackathon Certisign</text>
</g>
<g transform="translate(294,296)">
  <rect width="150" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="75" y="22" class="f" font-size="14" font-weight="600" fill="#67e8f9" text-anchor="middle">📍 Osasco – SP</text>
</g>

<!-- editor window -->
<g>
