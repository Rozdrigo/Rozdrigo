<text x="536" y="112" class="m" font-size="12" fill="#475569" text-anchor="end">1</text>
<text class="m fade" style="animation-delay:0.42s" x="560" y="136" font-size="14.5" fill="#e2e8f0"><tspan fill="#c084fc">public class</tspan> <tspan fill="#fde68a">Rodrigo</tspan> {</text>
