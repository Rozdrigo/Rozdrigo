<text class="m fade" style="animation-delay:0.66s" x="582" y="184" font-size="14.5" fill="#e2e8f0"><tspan fill="#c084fc">String</tspan> at = <tspan fill="#86efac">"Certisign"</tspan>;</text>
<text x="536" y="184" class="m" font-size="12" fill="#475569" text-anchor="end">4</text>
<text class="m fade" style="animation-delay:0.78s" x="582" y="208" font-size="14.5" fill="#e2e8f0"><tspan fill="#c084fc">List</tspan>&lt;String&gt; stack = <tspan fill="#7dd3fc">List.of</tspan>(</text>
<text x="536" y="208" class="m" font-size="12" fill="#475569" text-anchor="end">5</text>
<text class="m fade" style="animation-delay:0.90s" x="604" y="232" font-size="14.5" fill="#e2e8f0"><tspan fill="#86efac">"Java"</tspan>, <tspan fill="#86efac">"Spring"</tspan>, <tspan fill="#86efac">".NET"</tspan>, <tspan fill="#86efac">"Go"</tspan>,</text>
