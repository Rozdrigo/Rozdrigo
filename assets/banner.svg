<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390">
<style>
.f{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#111a33"/>
    <stop offset="1" stop-color="#1b1240"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.55">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
</defs>

<rect width="1000" height="390" rx="18" fill="url(#bg)"/>
<rect width="1000" height="390" rx="18" fill="url(#grid)"/>
<rect width="1000" height="390" rx="18" fill="url(#glow1)"/>
<rect width="1000" height="390" rx="18" fill="url(#glow2)"/>
<rect x="0.5" y="0.5" width="999" height="389" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

