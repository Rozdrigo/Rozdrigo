<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150">
<style>
.f{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#111a33"/>
    <stop offset="1" stop-color="#1b1240"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.55">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
</defs>

<rect width="480" height="150" rx="18" fill="url(#bg)"/>
<rect width="480" height="150" rx="18" fill="url(#grid)"/>
<rect width="480" height="150" rx="18" fill="url(#glow1)"/>
<rect width="480" height="150" rx="18" fill="url(#glow2)"/>
<rect x="0.5" y="0.5" width="479" height="149" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<rect x="24" y="26" width="56" height="56" rx="14" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.45"/>
<text x="52" y="61" class="m" font-size="18" font-weight="700" fill="#f472b6" text-anchor="middle">🌳</text>
<text x="98" y="50" class="f" font-size="20" font-weight="700" fill="#f8fafc">fractal_tree</text>
<text x="98" y="74" class="f" font-size="14" fill="#94a3b8">Árvore fractal gerada por recursão</text>
<circle cx="32" cy="118" r="6" fill="#f472b6"/>
<text x="46" y="123" class="f" font-size="13.5" fill="#cbd5e1">C++</text>
<text x="456" y="123" class="f" font-size="13.5" fill="#22d3ee" text-anchor="end" font-weight="600">ver repositório →</text>

</svg>
