<rect width="1000" height="580" rx="18" fill="url(#glow1)"/>
<rect width="1000" height="580" rx="18" fill="url(#glow2)"/>
<rect x="0.5" y="0.5" width="999" height="579" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
