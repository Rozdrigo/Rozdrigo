<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
<style>
.f{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#111a33"/>
    <stop offset="1" stop-color="#1b1240"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.55">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
</defs>

<rect width="1000" height="200" rx="18" fill="url(#bg)"/>
<rect width="1000" height="200" rx="18" fill="url(#grid)"/>
<rect width="1000" height="200" rx="18" fill="url(#glow1)"/>
<rect width="1000" height="200" rx="18" fill="url(#glow2)"/>
<rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<g class="fade" style="animation-delay:0.00s">
<rect x="30" y="28" width="221" height="144" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#22d3ee" stroke-opacity="0.35"/>
<rect x="52" y="44" width="34" height="4" rx="2" fill="#22d3ee"/>
<text x="52" y="104" class="f" font-size="46" font-weight="800" fill="#22d3ee">5+</text>
<text x="52" y="132" class="f" font-size="14.5" fill="#e2e8f0">anos construindo</text>
<text x="52" y="153" class="f" font-size="14.5" fill="#94a3b8">software em produção</text>
</g>
<g class="fade" style="animation-delay:0.15s">
<rect x="269" y="28" width="221" height="144" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#a78bfa" stroke-opacity="0.35"/>
<rect x="291" y="44" width="34" height="4" rx="2" fill="#a78bfa"/>
<text x="291" y="104" class="f" font-size="46" font-weight="800" fill="#a78bfa">6</text>
<text x="291" y="132" class="f" font-size="14.5" fill="#e2e8f0">empresas, de saúde</text>
<text x="291" y="153" class="f" font-size="14.5" fill="#94a3b8">a meios de pagamento</text>
</g>
<g class="fade" style="animation-delay:0.30s">
<rect x="508" y="28" width="221" height="144" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#4ade80" stroke-opacity="0.35"/>
<rect x="530" y="44" width="34" height="4" rx="2" fill="#4ade80"/>
<text x="530" y="104" class="f" font-size="46" font-weight="800" fill="#4ade80">4</text>
<text x="530" y="132" class="f" font-size="14.5" fill="#e2e8f0">linguagens de backend</text>
<text x="530" y="153" class="f" font-size="14.5" fill="#94a3b8">Java · C# · Go · Node</text>
</g>
<g class="fade" style="animation-delay:0.45s">
<rect x="747" y="28" width="221" height="144" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#fbbf24" stroke-opacity="0.35"/>
<rect x="769" y="44" width="34" height="4" rx="2" fill="#fbbf24"/>
<text x="769" y="104" class="f" font-size="46" font-weight="800" fill="#fbbf24">1º</text>
<text x="769" y="132" class="f" font-size="14.5" fill="#e2e8f0">lugar no primeiro</text>
<text x="769" y="153" class="f" font-size="14.5" fill="#94a3b8">Hackathon Certisign</text>
</g>

</svg>
