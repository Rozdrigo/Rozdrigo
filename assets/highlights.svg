<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.a{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect x=".5" y=".5" width="999" height="159" rx="16" fill="#ffffff" stroke="#e5e5e5"/>
<g class="a" style="animation-delay:0.00s"><text x="125.0" y="88" font-size="52" font-weight="300" letter-spacing="-2" fill="#000000" text-anchor="middle">5+</text><text x="125.0" y="120" font-size="14" fill="#6b6b6b" text-anchor="middle">anos de experiência</text></g><line x1="250.0" y1="1" x2="250.0" y2="159" stroke="#e5e5e5"/><g class="a" style="animation-delay:0.06s"><text x="375.0" y="88" font-size="52" font-weight="300" letter-spacing="-2" fill="#000000" text-anchor="middle">6</text><text x="375.0" y="120" font-size="14" fill="#6b6b6b" text-anchor="middle">empresas</text></g><line x1="500.0" y1="1" x2="500.0" y2="159" stroke="#e5e5e5"/><g class="a" style="animation-delay:0.12s"><text x="625.0" y="88" font-size="52" font-weight="300" letter-spacing="-2" fill="#000000" text-anchor="middle">4</text><text x="625.0" y="120" font-size="14" fill="#6b6b6b" text-anchor="middle">linguagens de backend</text></g><line x1="750.0" y1="1" x2="750.0" y2="159" stroke="#e5e5e5"/><g class="a" style="animation-delay:0.18s"><text x="875.0" y="88" font-size="52" font-weight="300" letter-spacing="-2" fill="#000000" text-anchor="middle">1º</text><text x="875.0" y="120" font-size="14" fill="#6b6b6b" text-anchor="middle">Hackathon Certisign</text></g>
</svg>
